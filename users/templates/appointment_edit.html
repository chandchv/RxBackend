{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Appointment{% endblock %}

{% block content %}
<div class="flex h-screen bg-gray-100">
    <div class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="max-w-3xl mx-auto bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900">Edit Appointment</h1>
                <button onclick="history.back()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Back
                </button>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <!-- Patient Information (Read-only) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Patient</label>
                    <p class="mt-1 text-sm text-gray-900">{{ appointment.patient.get_full_name }}</p>
                </div>

                <!-- Doctor Information (Read-only) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Doctor</label>
                    <p class="mt-1 text-sm text-gray-900">Dr. {{ appointment.doctor.user.get_full_name }}</p>
                </div>

                <!-- Date -->
                <div>
                    <label for="appointment_date" class="block text-sm font-medium text-gray-700">Date</label>
                    <input type="date" 
                           name="appointment_date" 
                           id="appointment_date"
                           value="{{ appointment.appointment_date|date:'Y-m-d' }}"
                           min="{{ min_date|date:'Y-m-d' }}"
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                           required>
                </div>

                <!-- Time -->
                <div>
                    <label for="appointment_time" class="block text-sm font-medium text-gray-700">Time</label>
                    <input type="time" 
                           name="appointment_time" 
                           id="appointment_time"
                           value="{{ appointment.appointment_time|time:'H:i' }}"
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                           required>
                </div>

                <!-- Reason -->
                <div>
                    <label for="reason" class="block text-sm font-medium text-gray-700">Reason for Visit</label>
                    <textarea name="reason" 
                              id="reason"
                              rows="3"
                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">{{ appointment.reason }}</textarea>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end space-x-4">
                    <button type="button" 
                            onclick="history.back()"
                            class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit"
                            class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(form);
        fetch(window.location.href, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(Object.fromEntries(formData)),
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = data.redirect_url;
            } else {
                alert(data.error || 'Error updating appointment');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error updating appointment');
        });
    });
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
