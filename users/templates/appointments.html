{% extends 'base.html' %}

{% block title %}Appointments{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
   
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        <a href="{% url 'users:admin_create_appointment' %}" class="text-white">Create Appointment</a>
    </button>

    <div class="bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold mb-6">Upcoming Appointments</h2>
        
        <div id="appointments-list">
            {% include "appointments_list.html" %}  <!-- Or whatever template contains your appointments list -->
        </div>
       
    </div>
</div>

<script>
    flatpickr("#appointment_date", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        minDate: "today"
    });
</script>
{% csrf_token %}
{% endblock %}
