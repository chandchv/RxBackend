<div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" 
     aria-hidden="true"
     id="modal-backdrop"
     onclick="closeModal()">
</div>

<div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg"
             onclick="event.stopPropagation()">
            <form hx-post="{% url 'users:appointment_edit' appointment.id %}"
                  hx-target="closest tr"
                  hx-swap="outerHTML">
                {% csrf_token %}
                <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                            <h3 class="text-base font-semibold leading-6 text-gray-900">
                                Edit Appointment
                            </h3>
                            <div class="mt-4 space-y-4">
                                <div>
                                    <p class="text-sm font-medium text-gray-500">Patient</p>
                                    <p class="text-sm text-gray-900">{{ appointment.patient.get_full_name }}</p>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-500">Doctor</p>
                                    <p class="text-sm text-gray-900">Dr. {{ appointment.doctor.get_full_name }}</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Date</label>
                                    <input type="date" 
                                           name="appointment_date" 
                                           value="{{ appointment.appointment_date|date:'Y-m-d' }}"
                                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                                           required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Time</label>
                                    <input type="time" 
                                           name="appointment_time" 
                                           value="{{ appointment.appointment_time|time:'H:i' }}"
                                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                                           required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Reason</label>
                                    <textarea name="reason" 
                                              rows="3"
                                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">{{ appointment.reason }}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button type="submit" 
                            class="inline-flex w-full justify-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 sm:ml-3 sm:w-auto">
                        Save Changes
                    </button>
                    <button type="button" 
                            class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto"
                            onclick="closeModal()">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
