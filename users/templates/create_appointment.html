{% extends 'base.html' %}

{% block title %}Schedule Appointment{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-bold mb-6">Schedule New Appointment</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-4">
                <!-- Patient Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Patient *</label>
                    <select name="patient" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        <option value="">Select Patient</option>
                        {% for patient in patients %}
                        <option value="{{ patient.id }}">{{ patient.get_full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Doctor *</label>
                    {{ form.doctor }}
                    {% if form.doctor.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ form.doctor.errors.0 }}</p>
                    {% endif %}
                </div>
                <!-- Appointment Details -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Date *</label>
                    <input type="date" name="appointment_date" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Time *</label>
                    <input type="time" name="appointment_time" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Reason for Visit</label>
                    <textarea name="reason" rows="3"
                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                </div>
                
                <!-- Appointment Type Options -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">Appointment Type</label>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <input type="checkbox" id="is_emergency" name="is_emergency" 
                                   class="rounded border-gray-300 text-red-600">
                            <label for="is_emergency" class="ml-2 text-sm text-red-600 font-medium">
                                Emergency Appointment
                            </label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="is_telemedicine" name="is_telemedicine" 
                                   class="rounded border-gray-300 text-blue-600">
                            <label for="is_telemedicine" class="ml-2 text-sm text-blue-600 font-medium">
                                Telemedicine Appointment
                            </label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="is_walk_in" name="is_walk_in" 
                                   class="rounded border-gray-300 text-green-600">
                            <label for="is_walk_in" class="ml-2 text-sm text-green-600 font-medium">
                                Walk-in Appointment
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <button type="submit" 
                        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                    Schedule Appointment
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
