<tr>
    <td class="px-6 py-4 whitespace-nowrap">{{ appointment.appointment_date }}</td>
    <td class="px-6 py-4 whitespace-nowrap">{{ appointment.appointment_time }}</td>
    <td class="px-6 py-4">{{ appointment.patient.get_full_name }}</td>
    <td class="px-6 py-4">{{ appointment.doctor.get_full_name }}</td>
    <td class="px-6 py-4">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                   {% if appointment.status == 'scheduled' %}bg-yellow-100 text-yellow-800
                   {% elif appointment.status == 'completed' %}bg-green-100 text-green-800
                   {% else %}bg-red-100 text-red-800{% endif %}">
            {{ appointment.get_status_display }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
        <button class="text-indigo-600 hover:text-indigo-900 mr-4"
                hx-get="{% url 'users:appointment_detail' appointment.id %}"
                hx-target="#appointment-detail-modal"
                hx-trigger="click">
            View
        </button>
        {% if appointment.status == 'scheduled' %}
        <button class="text-blue-600 hover:text-blue-900 mr-4"
                hx-get="{% url 'users:appointment_edit' appointment.id %}"
                hx-target="#appointment-detail-modal"
                hx-trigger="click">
            Edit
        </button>
        <button class="text-red-600 hover:text-red-900"
                hx-delete="{% url 'users:appointment_delete' appointment.id %}"
                hx-confirm="Are you sure you want to cancel this appointment?"
                hx-target="closest tr"
                hx-swap="outerHTML swap:1s">
            Cancel
        </button>
        {% endif %}
    </td>
</tr>
