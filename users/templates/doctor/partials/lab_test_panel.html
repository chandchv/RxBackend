<div class="space-y-6">
    <!-- Common Test Panels -->
    <div>
        <h4 class="font-medium mb-3">Common Test Panels</h4>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="addTestPanel('CBC')" 
                    class="p-3 text-left bg-blue-50 hover:bg-blue-100 rounded border border-blue-200">
                <strong class="text-blue-800">Complete Blood Count</strong>
                <div class="text-xs text-blue-600 mt-1">Hemoglobin, WBC, RBC, Platelets</div>
            </button>
            <button onclick="addTestPanel('LFT')" 
                    class="p-3 text-left bg-green-50 hover:bg-green-100 rounded border border-green-200">
                <strong class="text-green-800">Liver Function Tests</strong>
                <div class="text-xs text-green-600 mt-1">ALT, AST, Alkaline Phosphatase</div>
            </button>
            <button onclick="addTestPanel('KFT')" 
                    class="p-3 text-left bg-purple-50 hover:bg-purple-100 rounded border border-purple-200">
                <strong class="text-purple-800">Kidney Function Tests</strong>
                <div class="text-xs text-purple-600 mt-1">Creatinine, Urea, Electrolytes</div>
            </button>
            <button onclick="addTestPanel('Lipid')" 
                    class="p-3 text-left bg-orange-50 hover:bg-orange-100 rounded border border-orange-200">
                <strong class="text-orange-800">Lipid Profile</strong>
                <div class="text-xs text-orange-600 mt-1">Cholesterol, HDL, LDL, Triglycerides</div>
            </button>
            <button onclick="addTestPanel('Diabetes')" 
                    class="p-3 text-left bg-red-50 hover:bg-red-100 rounded border border-red-200">
                <strong class="text-red-800">Diabetes Screening</strong>
                <div class="text-xs text-red-600 mt-1">FBS, HbA1c, PP Sugar</div>
            </button>
            <button onclick="addTestPanel('Thyroid')" 
                    class="p-3 text-left bg-indigo-50 hover:bg-indigo-100 rounded border border-indigo-200">
                <strong class="text-indigo-800">Thyroid Function</strong>
                <div class="text-xs text-indigo-600 mt-1">TSH, T3, T4, Free T4</div>
            </button>
        </div>
    </div>

    <!-- Individual Tests -->
    <div>
        <h4 class="font-medium mb-3">Individual Tests</h4>
        <div class="grid grid-cols-3 gap-2">
            <button onclick="addIndividualTest('Blood Sugar')" 
                    class="p-2 text-left bg-gray-50 hover:bg-gray-100 rounded text-sm">
                Blood Sugar
            </button>
            <button onclick="addIndividualTest('Hemoglobin')" 
                    class="p-2 text-left bg-gray-50 hover:bg-gray-100 rounded text-sm">
                Hemoglobin
            </button>
            <button onclick="addIndividualTest('Creatinine')" 
                    class="p-2 text-left bg-gray-50 hover:bg-gray-100 rounded text-sm">
                Creatinine
            </button>
            <button onclick="addIndividualTest('Uric Acid')" 
                    class="p-2 text-left bg-gray-50 hover:bg-gray-100 rounded text-sm">
                Uric Acid
            </button>
            <button onclick="addIndividualTest('Vitamin D')" 
                    class="p-2 text-left bg-gray-50 hover:bg-gray-100 rounded text-sm">
                Vitamin D
            </button>
            <button onclick="addIndividualTest('PSA')" 
                    class="p-2 text-left bg-gray-50 hover:bg-gray-100 rounded text-sm">
                PSA
            </button>
        </div>
    </div>

    <!-- Custom Test -->
    <div>
        <h4 class="font-medium mb-3">Custom Test</h4>
        <div class="space-y-3">
            <input type="text" id="custom-test-name" 
                   placeholder="Enter test name" 
                   class="w-full border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <button onclick="addCustomTest()" 
                    class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Add Custom Test
            </button>
        </div>
    </div>

    <!-- Lab Selection -->
    <div>
        <h4 class="font-medium mb-3">Preferred Lab (Optional)</h4>
        <select id="lab-selection" class="w-full border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <option value="">Let patient choose</option>
            {% for lab in internal_labs %}
            <option value="internal-{{ lab.id }}">{{ lab.name }} (Internal)</option>
            {% endfor %}
            {% for lab in external_labs %}
            <option value="external-{{ lab.id }}">{{ lab.name }} (External)</option>
            {% endfor %}
        </select>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3 pt-4 border-t">
        <button onclick="hideQuickAdd()" 
                class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
            Cancel
        </button>
        <button onclick="applyLabTests()" 
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            Add to Prescription
        </button>
    </div>
</div>

<script>
// Debug function to check if everything is working
function debugLabTestPanel() {
    console.log('Lab test panel loaded');
    console.log('Container exists:', !!document.getElementById('lab-tests-container'));
    console.log('No lab tests element exists:', !!document.getElementById('no-lab-tests'));
    console.log('Global functions available:', {
        addTestPanel: typeof addTestPanel,
        addIndividualTest: typeof addIndividualTest,
        addCustomTest: typeof addCustomTest,
        applyLabTests: typeof applyLabTests
    });
}

// Call debug function when panel loads
debugLabTestPanel();
</script>
