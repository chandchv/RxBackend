<!-- Sidebar Backdrop (mobile) -->
<div id="sidebar-backdrop" class="fixed inset-0 bg-gray-600 bg-opacity-50 z-[5] hidden md:hidden" aria-hidden="true"></div>

<script>
    // Sidebar toggle functionality
    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const backdrop = document.getElementById('sidebar-backdrop');
        const openIcon = document.getElementById('menu-open-icon');
        const closeIcon = document.getElementById('menu-close-icon');
        
        // Function to toggle sidebar
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
            openIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
            
            // Prevent body scrolling when sidebar is open on mobile
            document.body.classList.toggle('overflow-hidden', !sidebar.classList.contains('-translate-x-full'));
        }
        
        // Toggle sidebar when button is clicked
        toggleBtn.addEventListener('click', toggleSidebar);
        
        // Close sidebar when backdrop is clicked
        backdrop.addEventListener('click', toggleSidebar);
        
        // Close sidebar when a link is clicked (on mobile)
        const sidebarLinks = sidebar.querySelectorAll('a');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', function() {
                if (window.innerWidth < 768) { // only on mobile
                    toggleSidebar();
                }
            });
        });
        
        // Handle resize event
        window.addEventListener('resize', function() {
            if (window.innerWidth >= 768) {
                // Ensure sidebar is visible on desktop
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
                openIcon.classList.remove('hidden');
                closeIcon.classList.add('hidden');
            } else if (!backdrop.classList.contains('hidden')) {
                // If backdrop is visible on mobile, sidebar is open
                openIcon.classList.add('hidden');
                closeIcon.classList.remove('hidden');
            } else {
                // If backdrop is hidden on mobile, sidebar is closed
                sidebar.classList.add('-translate-x-full');
                openIcon.classList.remove('hidden');
                closeIcon.classList.add('hidden');
            }
        });
    });
</script>
