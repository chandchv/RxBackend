<div class="modal-content bg-white rounded-lg shadow-xl p-6 max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Reschedule Appointment</h2>
        <button type="button" class="text-gray-400 hover:text-gray-500" onclick="closeModal()">
            <span class="sr-only">Close</span>
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <form hx-post="{% url 'users:appointment_edit' appointment.id %}"
          hx-target="#modal"
          class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Current Date & Time</label>
            <p class="mt-1 text-sm text-gray-500">
                {{ appointment.appointment_date|date:"F j, Y" }} at {{ appointment.appointment_time|time:"g:i A" }}
            </p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">New Date</label>
            <input type="date" 
                   name="appointment_date" 
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                   min="{{ min_date|date:'Y-m-d' }}"
                   required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Available Time Slots</label>
            <div id="time-slots" class="grid grid-cols-4 gap-2 mt-2">
                <!-- Time slots will be populated here -->
            </div>
            <input type="hidden" name="appointment_time" id="selected_time" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Reason for Rescheduling</label>
            <textarea name="reason" 
                      rows="3"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">{{ appointment.reason }}</textarea>
        </div>

        <div class="mt-6 flex space-x-4">
            <button type="submit"
                    class="inline-flex justify-center rounded-md border border-transparent bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Save Changes
            </button>
            <button type="button"
                    onclick="closeModal()"
                    class="inline-flex justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Cancel
            </button>
        </div>
    </form>
</div>

<script>
document.querySelector('input[name="appointment_date"]').addEventListener('change', function() {
    const doctorId = '{{ appointment.doctor.id }}';
    const selectedDate = this.value;
    loadTimeSlots(doctorId, selectedDate);
});

function loadTimeSlots(doctorId, selectedDate) {
    const slotsContainer = document.getElementById('time-slots');
    slotsContainer.innerHTML = '<p>Loading available slots...</p>';
    
    fetch(`/api/available-slots/doctor/${doctorId}/${selectedDate}/`)
        .then(response => response.json())
        .then(data => {
            slotsContainer.innerHTML = '';
            if (data.slots && data.slots.length > 0) {
                data.slots.forEach(slot => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'slot-button bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded m-1';
                    button.textContent = slot.time;
                    button.onclick = function() {
                        document.querySelectorAll('.slot-button').forEach(btn => {
                            btn.classList.remove('bg-green-500');
                            btn.classList.add('bg-blue-500');
                        });
                        this.classList.remove('bg-blue-500');
                        this.classList.add('bg-green-500');
                        document.getElementById('selected_time').value = slot.time;
                    };
                    slotsContainer.appendChild(button);
                });
            } else {
                slotsContainer.innerHTML = '<p>No available slots for this date</p>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            slotsContainer.innerHTML = '<p class="text-red-500">Error loading slots</p>';
        });
}
</script>
