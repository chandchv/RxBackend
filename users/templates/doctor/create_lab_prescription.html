{% extends 'base.html' %}
{% load static %}

{% block title %}Create Lab Test Prescription{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900">Create Lab Test Prescription</h1>
            <p class="text-gray-600 mt-2">for {{ patient.user.get_full_name }}</p>
        </div>

        <form method="POST" class="p-6">
            {% csrf_token %}
            
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-4">Lab Selection</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="flex items-center">
                        <input type="radio" id="lab_type_inhouse" name="preferred_lab_type" value="INHOUSE" class="mr-2">
                        <label for="lab_type_inhouse">In-house Lab</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="lab_type_external" name="preferred_lab_type" value="EXTERNAL" class="mr-2">
                        <label for="lab_type_external">External Lab</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="lab_type_patient" name="preferred_lab_type" value="PATIENT_CHOICE" class="mr-2" checked>
                        <label for="lab_type_patient">Let Patient Choose</label>
                    </div>
                </div>
            </div>

            <div id="lab-selection" class="mb-6 hidden">
                <h2 class="text-lg font-semibold mb-4">Select Lab</h2>
                <div id="inhouse-labs" class="mb-4 hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">In-house Labs</label>
                    <select name="selected_inhouse_lab" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        {% for lab in inhouse_labs %}
                        <option value="{{ lab.id }}">{{ lab.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div id="external-labs" class="mb-4 hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nearby Labs</label>
                    <select name="selected_lab" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        {% for lab in nearby_labs %}
                        <option value="{{ lab.id }}">{{ lab.name }} - {{ lab.city }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-4">Tests</h2>
                <div id="tests-container">
                    <div class="test-entry grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Test Name</label>
                            <input type="text" name="test_name[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Test Code</label>
                            <input type="text" name="test_code[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Price</label>
                            <input type="number" name="test_price[]" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Instructions</label>
                            <input type="text" name="test_instructions[]" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        </div>
                    </div>
                </div>
                <button type="button" id="add-test" class="mt-2 inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-blue-700 bg-blue-100 hover:bg-blue-200">
                    Add Another Test
                </button>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700">Notes</label>
                <textarea name="notes" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
                    Create Prescription
                </button>
            </div>
        </form>
    </div>
</div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const labTypeRadios = document.querySelectorAll('input[name="preferred_lab_type"]');
    const labSelection = document.getElementById('lab-selection');
    const inhouseLabs = document.getElementById('inhouse-labs');
    const externalLabs = document.getElementById('external-labs');
    
    labTypeRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'INHOUSE') {
                labSelection.classList.remove('hidden');
                inhouseLabs.classList.remove('hidden');
                externalLabs.classList.add('hidden');
            } else if (this.value === 'EXTERNAL') {
                labSelection.classList.remove('hidden');
                inhouseLabs.classList.add('hidden');
                externalLabs.classList.remove('hidden');
            } else {
                labSelection.classList.add('hidden');
            }
        });
    });

    const addTestButton = document.getElementById('add-test');
    const testsContainer = document.getElementById('tests-container');

    addTestButton.addEventListener('click', function() {
        const testEntry = document.querySelector('.test-entry').cloneNode(true);
        testEntry.querySelectorAll('input').forEach(input => input.value = '');
        testsContainer.appendChild(testEntry);
    });
});
</script>
{% endblock %}
{% endblock %}
