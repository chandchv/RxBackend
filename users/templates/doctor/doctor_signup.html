{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Doctor Registration
        </h2>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form class="space-y-6" method="POST" id="doctorSignupForm">
                {% csrf_token %}
                
                <!-- Basic Information -->
                <!-- ... similar fields as patient signup ... -->

                <!-- Doctor Specific Information -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">
                        Title/Designation
                    </label>
                    <input type="text" id="title" name="title" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>

                <div>
                    <label for="medical_degree" class="block text-sm font-medium text-gray-700">
                        Medical Degree
                    </label>
                    <input type="text" id="medical_degree" name="medical_degree" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>

                <!-- ... other doctor-specific fields ... -->

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Register as Doctor
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
