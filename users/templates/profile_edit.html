{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold mb-6">Edit Doctor Profile</h1>

        <form method="POST" action="{% url 'users:profile_edit_view' %}">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-8">
                <!-- Profile Information -->
                <div>
                    <h2 class="text-xl font-semibold mb-4">Personal Information</h2>
                    <div class="space-y-4">
                        <div>
                            <label for="first_name" class="block text-gray-700 text-sm font-bold mb-2">First Name</label>
                            <input type="text" id="first_name" name="first_name" value="{{ profile.user.first_name }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="last_name" class="block text-gray-700 text-sm font-bold mb-2">Last Name</label>
                            <input type="text" id="last_name" name="last_name" value="{{ profile.user.last_name }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                            <input type="email" id="email" name="email" value="{{ profile.user.email }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="medical_degree" class="block text-gray-700 text-sm font-bold mb-2">Medical Degree</label>
                            <input type="text" id="medical_degree" name="medical_degree" value="{{ profile.medical_degree }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="license_number" class="block text-gray-700 text-sm font-bold mb-2">License Number</label>
                            <input type="text" id="license_number" name="license_number" value="{{ profile.license_number }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="state_council" class="block text-gray-700 text-sm font-bold mb-2">State Council</label>
                            <input type="text" id="state_council" name="state_council" value="{{ profile.state_council }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Contact Information -->
                <div>
                    <h2 class="text-xl font-semibold mb-4">Contact Information</h2>
                    <div class="space-y-4">
                        <div>
                            <label for="phone_number" class="block text-gray-700 text-sm font-bold mb-2">Phone Number</label>
                            <input type="tel" id="phone_number" name="phone_number" value="{{ profile.phone_number }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="address" class="block text-gray-700 text-sm font-bold mb-2">Address</label>
                            <textarea id="address" name="address" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">{{ profile.address }}</textarea>
                        </div>
                        <div>
                            <label for="pincode" class="block text-gray-700 text-sm font-bold mb-2">Pincode</label>
                            <input type="text" id="pincode" name="pincode" value="{{ profile.pincode }}" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end space-x-4">
                <a href="{% url 'users:profile' %}" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
